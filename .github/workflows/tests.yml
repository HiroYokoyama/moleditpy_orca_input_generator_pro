name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'main' }}

jobs:
  # -------------------------------------------------------------------------
  # Standard unit tests  Eno external dependencies required
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=orca_input_generator_pro --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Integration tests  Eclones the main MoleditPy app to enable real
  # PluginContext tests (TestWithRealPluginContext)
  # -------------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Clone main MoleditPy application
        shell: bash
        run: |
          git init "../python_molecular_editor"
          git -C "../python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
          git -C "../python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
          git -C "../python_molecular_editor" checkout --detach FETCH_HEAD
          git -C "../python_molecular_editor" log -1 --format="%H %s"

      - name: Install main app package (no heavy deps)
        run: |
          pip install -e ../python_molecular_editor/moleditpy \
            --no-deps --quiet || true

      - name: Run integration tests with real PluginContext
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
        run: python -m pytest tests/test_plugin_integration.py tests/test_api.py -v
